<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Dhruv Kapur</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" sizes="32x32" href="/media/favicon/favicon-32x32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Inter:wght@400;500&family=JetBrains+Mono&display=swap">
    <link rel="stylesheet" href="/css/styles.css">
    <script>
        // Apply the saved (or system) color theme before first paint
        (function () {
            var theme;
            try { theme = localStorage.getItem('theme'); } catch (e) {}
            if (!theme) theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            document.documentElement.dataset.theme = theme;
        })();
    </script>
    <style>
        .not-found {
            min-height: 100svh;
            display: flex;
            align-items: center;
        }
        .not-found .hero-title { margin-bottom: 16px; }
        .not-found .hero-lede { margin-bottom: 32px; }
    </style>
</head>
<body>
    <main class="not-found">
        <div class="wrap">
            <p class="eyebrow">error 404</p>
            <h1 class="hero-title">lost<span class="dot">.</span></h1>
            <p class="hero-lede">The page you're looking for doesn't exist or has moved.</p>
            <div class="hero-actions">
                <a class="btn btn-primary" href="/">Back to home</a>
                <a class="btn" href="/#projects">Projects</a>
                <a class="btn" href="/#experience">Experience</a>
                <a class="btn btn-ghost" href="/#about">About</a>
            </div>
        </div>
    </main>
</body>
</html>
